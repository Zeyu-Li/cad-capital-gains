[tox]
isolated_build = true
skipsdist=true
envlist = py{311,312,313}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
allowlist_externals = poetry
commands =
    poetry install -v
    poetry run pytest --cov-report term --cov=capgains tests/

[testenv:flake8]
deps =
    flake8
    flake8-pyproject
commands =
    flake8
